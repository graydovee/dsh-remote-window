# dsh-remote-window bundle layer.
#
# The host row: owns the target store, the per-target agent presets and the
# wizard routes served from /dsh-remote-window. It injects the services it
# needs, so its activation order is resolved by the loader rather than by the
# row position. Most remote capability is registered as a new row (this layer)
# or a new agent-preset row (src/preset/world.ts).
- insert:
    - id: dsh-remote-window
      name: dsh-remote-window

# ── session persistence routing (documented deviation d13) ──────────────────
# Overrides the base persistence row so the
# agent-loop's host-plane persistence resolves to a cwd-router: local cwds
# delegate to the official JSONL backend with the same root (local sessions
# behave exactly as before), remote-window stub cwds go to the authoritative
# store on the remote server. A later layer wins per row and replaces the whole
# config, so every base key is restated. The plugin self-checks this override
# at activation and warns loudly if a future dsh renames the row.
# The loader rejects a name swap on override (name-mismatch guard), so the
# replacement is expressed as disable-official + insert-ours; the insert row
# provides the same service key and delegates local cwds to the same official
# JSONL class with the same root. The routing instance itself is constructed
# and provided by the plugin's own apply() — a patch `insert` row proved
# unreliable here (the loader never constructed it), while an in-apply provide
# on the now-free service name is guaranteed.
- id: session-persistence-jsonl
  disabled: true
