# QA-only sshd policy for the disposable target container.
# The container port is published on 127.0.0.1 only. Password auth exists for
# the client-host QA path; the password is a per-instance fixture set at start
# time (QA_TESTER_PASSWORD), never a real credential.
Port 22
ListenAddress 0.0.0.0
PermitRootLogin no
PasswordAuthentication yes
PermitEmptyPasswords no
KbdInteractiveAuthentication yes
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
UsePAM no
StrictModes yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes
GatewayPorts no
PrintMotd no
AcceptEnv LANG LC_*
