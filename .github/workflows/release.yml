name: release

# Publishes the plugin tarball of one tagged version: the GitHub Release gets
# the .tgz + .sha256, and the same tarball is pushed to npm (`dsh-remote-window`)
# with provenance. The runtime packages the remote world installs are a
# different artifact and are released from dsh-remote-window-server.
#
# npm needs the NPM_TOKEN repository secret (an npm automation token able to
# publish the scoped-or-unscoped package) and `id-token: write` for provenance.

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing tag to release (e.g. 0.1.0-alpha.1)'
        required: true
      npm_only:
        description: 'publish to npm only (skip the GitHub Release, e.g. to restore a deleted package)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # The tag names the release version; a local revision suffix must never
      # reach a release.
      - name: check tag matches package.json
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          want="$(node -p "require('./package.json').version")"
          got="${tag#v}"
          if [ "$got" != "$want" ]; then
            echo "tag $tag does not match package.json version $want" >&2
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Advisory until the build is confirmed reproducible on the runner.
      - name: lib is up to date with src
        continue-on-error: true
        run: git diff --exit-code -- lib

      - name: pack
        run: |
          set -euo pipefail
          mkdir -p dist
          pnpm pack --pack-destination dist
          tarball="$(ls dist/*.tgz)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          shasum -a 256 "$tarball" | cut -d' ' -f1 > "$tarball.sha256"
          cat "$tarball.sha256"

      # The published package ships lib/ and the profile patch only; source,
      # tests and maintainer docs stay out.
      - name: inspect tarball
        run: |
          set -euo pipefail
          listing="$(tar -tzf "$TARBALL")"
          echo "$listing"
          for forbidden in '/src/' '/tests/' '/doc/' '/node_modules/'; do
            if echo "$listing" | grep -q "$forbidden"; then
              echo "tarball contains $forbidden" >&2
              exit 1
            fi
          done

      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.npm_only }}
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/*.tgz.sha256

      # A prerelease version cannot be published onto the default `latest`
      # dist-tag (npm rejects it without --tag), so derive the tag from the
      # version: `0.1.0-alpha.3` -> `alpha`, `1.0.0` -> `latest`.
      - name: resolve npm dist-tag
        id: dist-tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"
            echo "tag=${tag%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # The exact tarball attached to the release above is the npm artifact:
      # `pnpm pack` already produced it from the tagged tree.
      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not configured" >&2
            exit 1
          fi
          npm publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"
