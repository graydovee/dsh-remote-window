# Build the remote-server packages and attach them to a GitHub Release.
#
# What a package contains: a staged `@deepseek-ai/dsh@<dsh-version>` for the
# target platform plus the Node distribution the plugin deploys — i.e. the
# remote execution world with no network access of its own. The plugin fetches
# one of these from
#   <mirror|https://github.com>/graydovee/dsh-remote-workspace/releases/download/<tag>/<asset>
# and verifies it against the `.sha256` companion, so both files must be
# attached.
#
# Matrix: linux x64/arm64 (glibc) and darwin x64/arm64. There is deliberately no
# Windows entry: the remote world is POSIX — every provisioning script is
# `/bin/sh` + `tar` + `chmod`, and `artifactTag()` accepts only linux|darwin.
# A Windows remote would need its own deployer first.
name: server-packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '@deepseek-ai/dsh version to stage'
        required: false
        default: '0.2.1-rc.2'

permissions:
  contents: write

env:
  DSH_VERSION: ${{ inputs.dsh_version || '0.2.1-rc.2' }}

jobs:
  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.libc && format('-{0}', matrix.libc) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            libc: gnu
          - platform: linux
            arch: arm64
            libc: gnu
          - platform: darwin
            arch: x64
            libc: ''
          - platform: darwin
            arch: arm64
            libc: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The build script drives `node <pnpm.cjs> -C <stage> add @deepseek-ai/dsh`,
      # so it needs a pnpm *file* plus a node binary, not a PATH shim: give it
      # exactly that through the plugin's own host-toolchain override.
      - name: host toolchain
        run: |
          set -euo pipefail
          npm install -g pnpm@10
          PNPM_CJS="$(npm root -g)/pnpm/bin/pnpm.cjs"
          test -f "$PNPM_CJS" || { echo "pnpm.cjs not found under $(npm root -g)" >&2; exit 1; }
          echo "DSH_HOST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "DSH_HOST_PNPM=$PNPM_CJS" >> "$GITHUB_ENV"
          node --version
          node "$PNPM_CJS" --version

      - name: build package
        shell: bash
        run: |
          set -euo pipefail
          args=(--dsh-version "$DSH_VERSION" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --out dist-server)
          if [ -n "${{ matrix.libc }}" ]; then args+=(--libc "${{ matrix.libc }}"); fi
          node scripts/build-server-package.mjs "${args[@]}"
          ls -l dist-server

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.libc && format('-{0}', matrix.libc) || '' }}
          path: |
            dist-server/*.tar.gz
            dist-server/*.tar.gz.sha256
            dist-server/*.manifest.json
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-server
          merge-multiple: true

      - name: list assets
        run: ls -l dist-server

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-server/*.tar.gz
            dist-server/*.tar.gz.sha256
            dist-server/*.manifest.json

      # The plugin looks the packages up under `server-v<dsh version>` first
      # (that is the version the tree was built against) and only then under
      # `v<plugin version>`. Publishing both names from the same job means a
      # human-facing tag such as v0.1.0-alpha1 is enough to make the download
      # path work, whatever the plugin version happens to be.
      - uses: softprops/action-gh-release@v2
        if: ${{ github.ref_name != format('server-v{0}', env.DSH_VERSION) }}
        with:
          tag_name: server-v${{ env.DSH_VERSION }}
          name: server packages for dsh ${{ env.DSH_VERSION }}
          body: |
            Staged `@deepseek-ai/dsh@${{ env.DSH_VERSION }}` runtime packages for
            the remote execution world, identical to the assets published under
            `${{ github.ref_name }}`.

            The plugin resolves this tag first (`server-v<dsh version>`), so this
            release is the one a connection actually downloads.
          fail_on_unmatched_files: true
          files: |
            dist-server/*.tar.gz
            dist-server/*.tar.gz.sha256
            dist-server/*.manifest.json
